<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="altarLight" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#FFD700"/><stop offset="1" stop-color="#8B4513"/></radialGradient>
  <filter id="rough"><feTurbulence baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="2"/><feFlood flood-color="#FFD700" flood-opacity="0.5"/><feComposite in="SourceGraphic"/></filter>
  <g id="scratch"><path d="M-14,-10 L10,14 M-6,-16 L16,8 M-14,6 L12,-12" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" fill="none"/></g>
</defs>

<!-- Background: Temple interior, stone columns -->
<rect width="1280" height="720" fill="#2a2416"/>
<g id="columns" opacity=".4">
  <rect x="100" y="0" width="80" height="720" fill="#5a5a5a" rx="20"/>
  <rect x="1100" y="0" width="80" height="720" fill="#5a5a5a" rx="20"/>
  <rect x="500" y="0" width="100" height="720" fill="#5a5a5a" rx="30" opacity=".3"/>
</g>

<!-- Altar stage -->
<ellipse cx="640" cy="500" rx="400" ry="150" fill="#8B4513" opacity=".3"/>
<rect x="400" y="350" width="480" height="200" fill="#A0826D" stroke="#5a4a3a" stroke-width="8"/>
<!-- Altar top -->
<rect x="420" y="330" width="440" height="40" fill="#C4A57B" stroke="#5a4a3a" stroke-width="6" rx="10"/>
<!-- Flame on altar -->
<g id="flame" filter="url(#glow)">
  <path d="M620,280 Q600,250 620,220 Q640,250 620,280" fill="#FFD700" opacity=".8"/>
  <path d="M630,270 Q620,250 630,230 Q640,250 630,270" fill="#FFA500" opacity=".6"/>
  <path d="M610,275 Q600,255 610,235 Q620,255 610,275" fill="#FFA500" opacity=".5"/>
</g>

<!-- HAMILCAR (elderly, scarred) -->
<g id="hamilcar" transform="translate(350, 280)" filter="url(#rough)">
  <g id="hamilcarBody">
    <path d="M-50,80 Q-55,40 -20,30 L20,30 Q55,40 50,150 L55,280 L-55,280Z" fill="#8B4513" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Armor straps -->
    <path d="M-50,80 L50,80 M-52,120 L52,120 M-54,160 L54,160" stroke="#a0a0a0" stroke-width="3" opacity=".6"/>
    <use href="#scratch" x="20" y="180"/>
  </g>
  <g id="hamilcarHead">
    <circle r="65" fill="#d4a574" stroke="#1a1a1a" stroke-width="4"/>
    <!-- Gray beard, weathered -->
    <path d="M-50,15 Q-40,60 0,62 Q40,60 50,15 Q30,40 0,40 Q-30,40 -50,15Z" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Scar on cheek -->
    <path d="M15,-5 Q25,10 20,28" stroke="#8a6a5a" stroke-width="4" fill="none" opacity=".7"/>
    <!-- Eyes (stern, determined) -->
    <circle cx="-25" cy="-10" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="25" cy="-10" r="16" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="-24" cy="-8" r="6" fill="#3a3a2a"/>
    <circle cx="24" cy="-8" r="6" fill="#3a3a2a"/>
    <!-- Brows: serious expression -->
    <path d="M-40,-22 L-5,-18" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <path d="M5,-18 L40,-22" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <!-- Mouth: stern -->
    <path d="M-20,35 Q0,30 20,35" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Iron helmet -->
    <path d="M-70,-20 Q-70,-80 0,-85 Q70,-80 70,-20 Q40,-30 0,-35 Q-40,-30 -70,-20Z" fill="#6a6a6a" stroke="#1a1a1a" stroke-width="4"/>
    <!-- Helmet cheekplates -->
    <path d="M-72,-5 L-50,30 L-45,10 L-68,-10Z" fill="#6a6a6a" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M72,-5 L50,30 L45,10 L68,-10Z" fill="#6a6a6a" stroke="#1a1a1a" stroke-width="3"/>
  </g>
  <!-- Pointing hand (gesturing to Hannibal) -->
  <g id="hamilcarArm" transform="translate(50,120)">
    <path d="M0,0 L80,-60" stroke="#d4a574" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="-60" r="15" fill="#d4a574" stroke="#1a1a1a" stroke-width="3"/>
  </g>
</g>

<!-- YOUNG HANNIBAL (boy, ~10 years old) -->
<g id="youngHannibal" transform="translate(850, 320)" filter="url(#rough)">
  <g id="yhBody">
    <path d="M-30,50 Q-35,20 -10,15 L10,15 Q35,20 30,100 L32,150 L-32,150Z" fill="#6b3f8f" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="yhHead">
    <circle r="48" fill="#f2ece0" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Young face, serious expression -->
    <path d="M-35,10 Q-28,45 0,46 Q28,45 35,10 Q20,28 0,28 Q-20,28 -35,10Z" fill="#3a3a2a" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Eyes (young, intense) -->
    <circle cx="-18" cy="-8" r="14" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="18" cy="-8" r="14" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <!-- One eye with eyepatch (foreshadowing) -->
    <circle cx="-16" cy="-6" r="5" fill="#3a3a2a"/>
    <ellipse cx="18" cy="-8" rx="15" ry="14" fill="#1a1a1a" opacity=".3"/>
    <!-- Brows: also serious -->
    <path d="M-30,-20 L-5,-15" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M5,-15 L30,-20" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <!-- Mouth: determined line -->
    <path d="M-15,32 Q0,30 15,32" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Small cap/crown -->
    <path d="M-48,-15 Q-45,-48 0,-50 Q45,-48 48,-15" fill="#FFB81C" stroke="#1a1a1a" stroke-width="3"/>
  </g>
  <!-- Hannibal looking at father (eye gaze down-left toward Hamilton) -->
  <g id="yhEyeGaze">
    <animate attributeName="opacity" values="1;1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </g>
</g>

<!-- Oath gesture: line connecting hands over the altar fire -->
<g id="oathLine" opacity="0" stroke="#FFD700" stroke-width="3" stroke-dasharray="5,5">
  <line x1="430" y1="200" x2="820" y2="320"/>
</g>

<!-- Light rays from altar (divine) -->
<g id="lightRays" opacity="0">
  <line x1="640" y1="280" x2="640" y2="100" stroke="#FFD700" stroke-width="2" opacity=".3"/>
  <line x1="640" y1="280" x2="500" y2="120" stroke="#FFD700" stroke-width="2" opacity=".2"/>
  <line x1="640" y1="280" x2="780" y2="140" stroke="#FFD700" stroke-width="2" opacity=".2"/>
</g>

<!-- Caption text -->
<g id="caption" opacity="0">
  <rect x="200" y="600" width="880" height="80" rx="10" fill="#1a1a1a" opacity=".9"/>
  <text x="640" y="655" font-family="Arial, sans-serif" font-size="28" fill="#fff" text-anchor="middle">Hamilcar makes a vow to his son</text>
</g>

</svg>

<script>
const $=id=>document.getElementById(id);
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);

window.render=function(t){
  // 0-2s: Fade in scene
  const sceneIn=ease(t/1);
  document.querySelector('rect[width="1280"]').setAttribute('opacity',sceneIn);
  $('columns').setAttribute('opacity',0.4*sceneIn);

  // Flame animation
  $('flame').setAttribute('transform',`translate(0,${Math.sin(t*3)*3})`);

  // 0.3-1.5s: Hamilcar's body language (stern, pointing at Hannibal)
  if(t>0.3){
    const pointPhase=Math.min(1,(t-0.3)/1.2);
    $('hamilcar').setAttribute('opacity',ease(pointPhase));
    // Slight head turn to look at son
    $('hamilcarHead').setAttribute('transform',`translate(0,${Math.sin(t*1.2)*2}) rotate(${Math.sin((t-0.3)*0.8)*2})`);
  }

  // 0.5-2s: Young Hannibal fades in and looks determined
  if(t>0.5){
    const yhPhase=Math.min(1,(t-0.5)/1.5);
    $('youngHannibal').setAttribute('opacity',ease(yhPhase));
    // Breathing animation
    $('yhBody').setAttribute('transform',`translate(0,${Math.sin(t*1.5)*2})`);
    // Eyes widen with determination around 1.5-2s
    const eyeWiden=Math.max(0,ease((t-1.2)/0.4));
    // Slight head bow toward father
    $('yhHead').setAttribute('transform',`translate(0,${Math.sin(t*0.8)*1.5}) rotate(${Math.sin((t-0.5)*0.5)*1})`);
  }

  // 1.2-1.8s: Oath moment - line connects, light rays appear
  if(t>1.2 && t<1.8){
    const oathPhase=ease((t-1.2)/0.6);
    $('oathLine').setAttribute('opacity',oathPhase);
    $('lightRays').setAttribute('opacity',oathPhase*0.6);
  }

  // 1.5-2.5s: Caption
  if(t>1.5 && t<3.5){
    const capPhase=Math.min(1,(t-1.5)/0.4);
    const capOut=Math.max(0,ease((3.5-t)/0.4));
    $('caption').setAttribute('opacity',capPhase*capOut);
  }

  // Overall scene fades out at end
  if(t>3){
    const fadeOut=ease((3.5-t)/0.5);
    document.querySelector('svg').setAttribute('opacity',fadeOut);
  }
};

window.render(0);
</script></body></html>
