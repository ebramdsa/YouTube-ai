<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../lib/toon.js"></script><script src="../../lib/kit.js"></script><script src="cast.js"></script>
<script>
// YouTube thumbnail variants: #a (both kings claim the win), #b (Ramesses and his "fake news" carving)
const { C, f } = T, E = T.expr;
window.render = () => { T.reset();
  const v = location.hash.slice(1) || 'a';
  let s = T.defs();
  if (v === 'a') {
    s += `<rect width="1920" height="1080" fill="${EP.P.egBlue}"/><rect x="960" width="960" height="1080" fill="#c4372c"/>`;
    s += `<path d="M1010,0 L910,1080" stroke="${C.ink}" stroke-width="16"/>`;
    s += EP.ramesses({ x: 470, y: 520, s: 1.45, e: E('smug', { look: [.4, 0], mouth: { type: 'smirk', w: 34 } }), arms: { r: { x: 220, y: 60, pose: 'thumb' } } });
    s += EP.muwatalli({ x: 1450, y: 600, s: 1.35, flip: true, e: E('smug', { lid: .5, look: [.4, 0], mouth: { type: 'smirk', w: 34 } }), arms: { r: { x: 220, y: 60, pose: 'thumb' } } });
    s += T.text('WHO WON?', 960, 200, 210, { fill: '#fff', sw: 30, rot: -3 });
    s += T.text('WINNER', 470, 1010, 120, { fill: C.gold, sw: 22, rot: -4 }) + T.text('WINNER', 1450, 1010, 120, { fill: C.gold, sw: 22, rot: 4 });
  } else {
    s += EP.wall(0, { x: -20, y: -20, w: 1960, h: 1120, bg: '#f0d79a' });
    s += EP.carve(EP.chariot({ t: 0, speed: 0, crew: [EP.ramesses({ s: .45, pose: 'chibi', e: E('proud'), arms: { r: { x: 140, y: 30, pose: 'fist' } } })] }), 40, 1020, 1.3);
    for (let i = 0; i < 4; i++) s += EP.carve(EP.hittite({ s: .34, e: E('scared'), rot: (i * 53) % 160 - 80, seed: 1300 + i }), 640 + (i % 2) * 150, 380 + Math.floor(i / 2) * 230, 1);
    s += `<rect width="1920" height="1080" fill="#2a1d17" opacity=".18"/>`;
    s += EP.ramesses({ x: 1480, y: 470, s: 1.6, e: E('smug', { look: [-.5, 0], mouth: { type: 'smirk', w: 34 } }), arms: { l: { x: -280, y: 120, pose: 'open', bend: -30 } } });
    s += T.text('FAKE NEWS', 660, 200, 190, { fill: C.red, stroke: '#fff', sw: 26, rot: -5 });
    s += T.text('3,000 YEARS AGO', 660, 330, 90, { fill: '#fff', sw: 18, rot: -5 });
  }
  s += T.overlay({ paper: .25, vig: .8 });
  document.getElementById('s').innerHTML = s; };
render();
</script></body></html>
