<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../lib/toon.js"></script>
<script src="cues.js"></script>
<script>
const { C, E = T.expr, ease, clamp, lerp, pop, text, f } = T;
const S = CUES.shots;

function cam(inner, z = 1, cx = 960, cy = 540, shake = 0, t = 0) {
  const sx = shake * Math.sin(t * 90) * 14, sy = shake * Math.cos(t * 77) * 10;
  return `<g transform="translate(${f(960 + sx)},${f(540 + sy)}) scale(${f(z * 1.03)}) translate(${-cx},${-cy})">${inner}</g>`;
}
const shakeAt = (t, hits, d = .25) => hits.reduce((m, h) => Math.max(m, t > h && t < h + d ? 1 - (t - h) / d : 0), 0);
const march = (t, ph = 0) => ({ bob: -Math.abs(Math.sin(t * 6 + ph)) * 9, step: Math.sin(t * 6 + ph) });

function poof(x, y, k, s = 1, seed = 1) {
  if (k <= 0 || k >= 1) return '';
  const R = T.rng(seed); let g = '';
  for (let i = 0; i < 9; i++) { const a = R() * Math.PI * 2, d = ease(k) * (60 + R() * 120) * s, r = (30 + R() * 40) * s * (1 - k * .5);
    g += `<path d="${T.blobPath(x + Math.cos(a) * d, y + Math.sin(a) * d * .7, r, R)}" fill="#d9ccb4" stroke="${C.ink}" stroke-width="5"/>`; }
  return `<g opacity="${f(1 - ease((k - .6) / .4))}">${g}</g>`;
}
function stamp(word, x, y, t, t0, rot) {
  const p = pop(t, t0, .22); if (!p.k) return '';
  const xk = ease((t - t0 - .3) / .18);
  let s = text(word, x, y, 120, { scale: lerp(2.2, 1, ease((t - t0) / .22)), rot, fill: '#fff' });
  if (xk > 0) s += `<g transform="translate(${x},${y - 40}) rotate(${rot})" stroke="${C.red}" stroke-width="26" stroke-linecap="round" opacity=".92">
    <path d="M-${f(240 * xk)},-${f(70 * xk)} L${f(240 * xk)},${f(70 * xk)}"/>${xk > .5 ? `<path d="M-${f(240 * (xk - .5) * 2)},${f(70 * (xk - .5) * 2)} L${f(240 * (xk - .5) * 2)},-${f(70 * (xk - .5) * 2)}"/>` : ''}</g>`;
  return s;
}
function lowerThird(name, sub, t, t0) {
  const k = ease((t - t0) / .35); if (k <= 0) return '';
  const x = lerp(-700, 60, k);
  return `<g transform="translate(${f(x)},880)"><rect x="0" y="0" width="560" height="130" rx="18" fill="${C.ink}" opacity=".88"/>
  <rect x="0" y="0" width="16" height="130" rx="6" fill="${C.red}"/>
  <text x="44" y="66" font-family="Luckiest" font-size="58" fill="#fff">${name}</text>
  <text x="46" y="108" font-family="Lilita" font-size="32" fill="${C.gold}">${sub}</text></g>`;
}

// ---- shot 1: the plain at Cannae ----
function shot1(t) {
  let s = `<rect width="1920" height="1080" fill="#e9c77d"/><circle cx="1380" cy="300" r="120" fill="#f6e3a8" opacity=".9"/>
  <path d="M0,560 Q300,470 620,530 T1240,500 T1920,520 L1920,1080 L0,1080Z" fill="#c99c58" stroke="${C.ink}" stroke-width="5" opacity=".75"/>
  <path d="M0,660 Q480,600 960,650 T1920,630 L1920,1080 L0,1080Z" fill="#b8874a" stroke="${C.ink}" stroke-width="6"/>
  <path d="M-20,760 Q300,720 520,780 T1100,770 T1940,800" stroke="#5f93b8" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M-20,760 Q300,720 520,780 T1100,770 T1940,800" stroke="${C.ink}" stroke-width="4" fill="none" opacity=".4"/>
  <path d="M0,860 Q640,820 1920,880 L1920,1080 L0,1080Z" fill="#a37741" stroke="${C.ink}" stroke-width="6"/>`;
  const tents = (x0, col, n) => { let g = ''; for (let i = 0; i < n; i++) { const x = x0 + i * 46 + (i % 3) * 7, y = 630 + (i % 2) * 14;
    g += `<path d="M${x - 20},${y} L${x},${y - 30} L${x + 20},${y}Z" fill="#e6d7b8" stroke="${C.ink}" stroke-width="3.5"/>`; }
    return g + `<path d="M${x0 + 60},${640} L${x0 + 60},560" stroke="${C.ink}" stroke-width="4"/><path d="M${x0 + 60},560 l40,10 l-40,12Z" fill="${col}" stroke="${C.ink}" stroke-width="3"/>`; };
  s += tents(180, C.red, 12) + tents(1320, C.purple, 7);
  const R = T.rng(5); for (let i = 0; i < 26; i++) { const x = (R() * 1920 + t * (30 + R() * 50)) % 1920, y = 300 + R() * 600; s += `<circle cx="${f(x)}" cy="${f(y + Math.sin(t + i) * 10)}" r="${f(3 + R() * 5)}" fill="#fff6d8" opacity=".5"/>`; }
  const p1 = pop(t, 1.0), p2 = pop(t, 2.8);
  let o = text('AUGUST 2, 216 BC', 960, 330, 130, { scale: p1.scale, k: p1.k });
  o += text('SOUTHERN ITALY', 960, 450, 70, { scale: p2.scale, k: p2.k, fill: C.gold });
  return cam(s, 1 + t * .018, 960, 540, shakeAt(t, [1.0, 2.8], .15), t) + o;
}

// ---- shot 2: Varro and the marching legions ----
function shot2(t) {
  const lt = t - S[1];
  let s = T.bg('#cdb27a', { sil: '#7d6338', seed: 3 });
  s += T.standard(980, 1040, 1.45);
  const row = [[150, 610, .5, 2.4], [300, 650, .6, 1.6], [470, 700, .72, .8], [670, 760, .86, 0]];
  for (const [x, y, sc, ph] of row) { const m = march(t, ph);
    s += T.legionary({ x: x + Math.sin(lt * .6) * 6, y, s: sc, bob: m.bob, step: m.step * .6, seed: Math.round(x), e: E(ph > 1 ? 'proud' : 'smug'),
      shield: [-40, 175, .78], arms: { r: { x: 70, y: 150, pose: 'grip' } }, spear: [50, 270, 110, -250] }); }
  const ve = lt > 3.6 ? T.mix('smug', 'proud', ease((lt - 3.6) / .4)) : E('smug');
  s += T.varro({ x: 1430, y: 650 + Math.sin(t * 1.4) * 4, s: 1.5, e: ve, rot: lt > 3.6 ? -ease((lt - 3.6) / .4) * 4 : 0 });
  const p = pop(t, S[1] + 3.8);
  let o = text('THE BIGGEST ROMAN ARMY EVER', 960, 150, 92, { scale: p.scale, k: p.k });
  o += lowerThird('VARRO', 'Consul of Rome', t, S[1] + .6);
  return cam(s, 1.04 - lt * .006, 960, 540, shakeAt(t, [S[1] + 3.8], .15), t) + o;
}

// ---- shot 3: 86,000 ----
function shot3(t) {
  const lt = t - S[2];
  let s = T.bg('#d8b468', { sil: '#8a6a3a', seed: 7 });
  const kinds = ['smug', 'proud', 'neutral', 'smug', 'bored', 'proud'];
  for (let r = 0; r < 5; r++) {
    const sc = .26 + r * .085, y = 250 + r * 165, gap = 230 * sc + 40, n = Math.ceil(2300 / gap);
    for (let i = 0; i < n; i++) { const x = -200 + i * gap + (r % 2) * gap / 2, m = march(t, i * .7 + r);
      s += T.legionary({ x, y, s: sc, bob: m.bob * sc * 1.4, step: m.step * .5, seed: r * 31 + i, e: E(kinds[(i * 7 + r * 3) % 6]),
        shield: [-40, 175, .78], arms: { r: { x: 70, y: 150, pose: 'grip' } }, spear: [50, 270, 110, -250] }); }
  }
  const p = pop(t, S[2] + .4, .3);
  const o = text('86,000', 960, 560, 260, { scale: p.scale, k: p.k }) + text('ROMANS &amp; ALLIES', 960, 690, 64, { k: ease((lt - .9) / .3), fill: C.gold });
  return cam(s, lerp(1.35, 1.0, ease(lt / 2.6)), 960, 540, shakeAt(t, [S[2] + .4], .2), t) + o;
}

// ---- shot 4: the Carthaginian side ----
function shot4(t) {
  const lt = t - S[3];
  let s = T.bg('#b9c79a', { sil: '#6f7f55', seed: 11 });
  s += `<path d="M0,900 Q960,860 1920,900 L1920,1080 L0,1080Z" fill="#9aa877" stroke="${C.ink}" stroke-width="6"/>`;
  const look = lt > 3.9 ? [ease((lt - 3.9) / .2) * .9, 0] : [0, 0];
  const scratch = Math.sin(lt * 18) * 10;
  s += T.gaul({ x: 600, y: 600, s: 1.15, e: E('bored', { look }), arms: { l: { x: -110, y: 210 }, r: { x: 60 + scratch * .3, y: -110 + scratch, pose: 'open', bend: -40 } } });
  const yawn = lt > 1.0 && lt < 2.4 ? Math.sin(Math.PI * (lt - 1.0) / 1.4) : 0;
  const ie = yawn > .05 ? E('bored', { lid: .75, mouth: { type: 'o', w: 14 + yawn * 10, open: yawn }, look }) : E('bored', { look });
  s += T.iberian({ x: 1320, y: 600, s: 1.15, e: ie, arms: { l: { x: -100, y: 200 }, r: { x: 90, y: 150, pose: 'grip' } }, spear: [80, 270, 150, -280] });
  const p = pop(t, S[3] + 2.9);
  const o = text('~50,000', 960, 190, 180, { scale: p.scale, k: p.k }) + text('CARTHAGE &amp; FRIENDS', 960, 290, 56, { k: ease((lt - 3.3) / .3), fill: C.purple, stroke: '#fff', sw: 10 });
  return cam(s, 1.02 + lt * .006, 960, 540, shakeAt(t, [S[3] + 2.9], .15), t) + o;
}

// ---- shot 5: and one working eye ----
function shot5(t) {
  const lt = t - S[4];
  let s = `<rect width="1920" height="1080" fill="#f2cf2e"/>`;
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + lt * .05; s += `<path d="M960,600 L${f(960 + Math.cos(a) * 1600)},${f(600 + Math.sin(a) * 1600)} L${f(960 + Math.cos(a + .09) * 1600)},${f(600 + Math.sin(a + .09) * 1600)}Z" fill="#f7dc55"/>`; }
  const blink = lt > 2.2 && lt < 2.34;
  let e = E('bored', { look: [-.15, .1] });
  if (lt > 2.6) e = T.mix(e, E('bored', { brow: { r: 22 }, look: [-.15, .1] }), ease((lt - 2.6) / .2));
  if (blink) e.lid = 1;
  s += T.hannibal({ x: 960, y: 560 + Math.sin(t * 1.3) * 4, s: 1.9, e });
  const p = pop(t, S[4] + 1.6);
  let o = '';
  if (p.k) o += `<g opacity="${p.k}"><path d="M600,370 Q800,340 862,520" stroke="${C.ink}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M828,500 L866,534 L880,488" stroke="${C.ink}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`
    + text('WORKING EYES: 1', 430, 330, 78, { scale: p.scale, rot: -5 });
  o += lowerThird('HANNIBAL', 'General of Carthage', t, S[4] + .4);
  return cam(s, 1 + lt * .02, 960, 540, shakeAt(t, [S[4] + 1.6], .12), t) + o;
}

// ---- shot 6 & 7: they won't be defeated... they will cease to exist ----
function lineup(t, stage, fade) {
  const ex = st => st < 1 ? T.mix('smug', 'neutral', st) : st < 2 ? T.mix('neutral', 'worried', st - 1) : T.mix('worried', 'scared', Math.min(1, st - 2));
  const e = ex(stage), sw = clamp(stage - 2);
  const vis = [fade[0], fade[1], fade[2]];
  let s = '';
  if (vis[0] < 1) s += `<g opacity="${f(1 - ease(vis[0] * 3))}">${T.legionary({ x: 330, y: 650 + Math.sin(t * 2) * 3, s: 1.5, pose: 'bust', e: { ...e, look: [.3, 0] }, seed: 2, sweat: sw })}</g>`;
  if (vis[2] < 1) s += `<g opacity="${f(1 - ease(vis[2] * 3))}">${T.legionary({ x: 1600, y: 650 + Math.sin(t * 2 + 1) * 3, s: 1.45, pose: 'bust', e: { ...e, look: [-.3, 0] }, seed: 9, sweat: sw })}</g>`;
  if (vis[1] < 1) s += `<g opacity="${f(1 - ease(vis[1] * 3))}">${T.varro({ x: 960, y: 610 + Math.sin(t * 2 + 2) * 3, s: 1.3, e, sweat: sw })}</g>`;
  return s;
}
function shot6(t) {
  const lt = t - S[5];
  const stage = clamp((t - 24.9) / .35) + clamp((t - 26.5) / .35) + clamp((t - 27.9) / .35);
  let s = T.bg('#d8b468', { sil: '#8a6a3a', seed: 5 }) + lineup(t, stage, [0, 0, 0]);
  const o = stamp('DEFEATED', 480, 230, t, 24.9, -7) + stamp('RETREAT', 1000, 160, t, 26.5, 3) + stamp('SURRENDER', 1450, 250, t, 27.9, -4);
  return cam(s, 1 + lt * .01, 960, 540, shakeAt(t, [24.9, 26.5, 27.9], .2), t) + o;
}
function shot7(t) {
  const lt = t - S[6];
  const dark = ease(lt / 1.2);
  const fades = [30.9, 31.5, 31.2].map(h => clamp((t - h) / .9));
  let s = T.bg('#d8b468') + `<rect width="1920" height="1080" fill="#2a1d17" opacity="${f(dark * .82)}"/>`;
  s += `<g filter="url(#blur8)" fill="#000" opacity=".35">${T.crowd(5)}</g>`;
  s += lineup(t, 3, fades);
  s += poof(330, 600, (t - 30.9) / .9, 1.6, 1) + poof(1600, 600, (t - 31.2) / .9, 1.6, 2) + poof(960, 560, (t - 31.5) / .9, 1.6, 3);
  const hk = clamp((t - 31.6) / .7);
  if (hk > 0) { const y = lerp(480, 930, hk * hk), bounce = hk >= 1 ? Math.abs(Math.sin((t - 32.3) * 9)) * 30 * Math.exp(-(t - 32.3) * 5) : 0;
    s += `<g transform="translate(960,${f(y - bounce)}) rotate(${f(hk * 160 + (hk >= 1 ? 20 : 0))}) scale(1)">${T.galea({ metal: C.gold, metalDark: C.bronzeDark, crest: '#f2eee4', crestH: 190, seed: 33 })}</g>`; }
  return cam(s, 1 + lt * .02, 960, 540, shakeAt(t, [30.9, 31.2, 31.5], .2), t);
}

// ---- shot 8: title card ----
function shot8(t) {
  const lt = t - S[7];
  let s = `<rect width="1920" height="1080" fill="#1d1411"/>`;
  s += `<g opacity=".9">${T.grime('M0,0 H1920 V1080 H0Z', [0, 0, 1920, 1080], 4, { n: 14, scratches: 10, op: .3, col: '#5a3a2a', shade: false })}</g>`;
  const p = pop(t, S[7] + .2, .3);
  s += text('CANNAE', 960, 560, 300, { scale: p.scale, k: p.k, fill: C.red, stroke: '#fff', sw: 22, ls: 8 });
  s += text('THE DAY ROME LOST EVERYTHING', 960, 700, 70, { k: ease((lt - 1.0) / .4), fill: '#fff' });
  s += text('SPEARS &amp; TEARS', 960, 980, 40, { k: ease((lt - 1.8) / .4), fill: C.gold, font: 'Lilita', sw: 6 });
  const fadeOut = ease((t - (CUES.duration - .8)) / .8);
  return cam(s, 1 + lt * .015, 960, 540, shakeAt(t, [S[7] + .2], .25), t) + `<rect width="1920" height="1080" fill="#000" opacity="${f(fadeOut)}"/>`;
}

const SHOTS = [shot1, shot2, shot3, shot4, shot5, shot6, shot7, shot8];
window.render = t => {
  T.reset();
  let i = 0; while (i < S.length - 1 && t >= S[i + 1]) i++;
  const fadeIn = i === 0 ? ease(t / .5) : 1;
  document.getElementById('s').innerHTML = T.defs() + SHOTS[i](t) + T.overlay({ paper: .3 }) +
    `<rect width="1920" height="1080" fill="#000" opacity="${f(1 - fadeIn)}"/>`;
};
render(0);
</script></body></html>
