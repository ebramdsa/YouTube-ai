<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../lib/toon.js"></script><script src="../../lib/kit.js"></script><script src="timing.js"></script><script src="battle.js"></script>
<script>
// Section 8 — Outro
const { C, ease, clamp, lerp, f } = T, E = T.expr;
const { S, W, dur } = K.timingFor(8);
const hits = [];
const H = t => (hits.push(t), t);
const city = (t, k = 1) => { let s = '';
  const bld = [[260, 300, 200], [520, 380, 240], [820, 460, 300], [1140, 360, 260], [1440, 420, 220], [1700, 300, 180]];
  for (const [x, h, w] of bld) { const y = 760 - h * k;
    s += `<rect x="${x - w / 2}" y="${f(y)}" width="${w}" height="${f(h * k)}" fill="#e8dcc4" stroke="${C.ink}" stroke-width="7"/>`;
    for (let c = 0; c < 4; c++) s += `<rect x="${x - w / 2 + 20 + c * (w - 40) / 3 - 8}" y="${f(y + 40)}" width="16" height="${f(Math.max(0, h * k - 50))}" fill="#cfc3ad"/>`;
    s += `<path d="M${x - w / 2 - 16},${f(y)} L${x},${f(y - 70 * k)} L${x + w / 2 + 16},${f(y)}Z" fill="${C.red}" stroke="${C.ink}" stroke-width="7" stroke-linejoin="round"/>`; }
  return s; };

const shots = [
  [0, (t, lt) => { // lessons
    let s = K.burst(t, '#c9a46a', '#d6b47a');
    const card = (n, str, y, t0, col) => { const k = T.back((t - t0) / .35); if (t < t0) return '';
      return `<g transform="translate(${f(lerp(-900, 960, Math.min(1, k)))},${y})"><rect x="-760" y="-70" width="1520" height="140" rx="24" fill="${C.ink}" opacity=".9"/>
        <circle cx="-680" cy="0" r="46" fill="${col}" stroke="#fff" stroke-width="6"/><text x="-680" y="18" font-family="Luckiest" font-size="52" text-anchor="middle" fill="#fff">${n}</text>
        <text x="-600" y="22" font-family="Luckiest" font-size="62" fill="#fff">${str}</text></g>`; };
    s += card(1, "NUMBERS DON'T ALWAYS WIN", 340, H(S(1)), C.red) + card(2, 'STRATEGY BEATS BRUTE FORCE', 540, H(S(2)), C.purple) + card(3, 'ONE GENIUS > 86,000 MEN', 740, H(S(3)), C.gold);
    return K.cam(s, 1, 960, 540, 0, t) + K.chapter(8, 'WHAT CANNAE TEACHES', t, 0, 1.6) + K.say('WHAT DO WE LEARN?', 960, 160, 100, t, 1.7);
  }],
  [S(4), (t, lt) => { // limits of genius
    let s = `<rect width="1920" height="1080" fill="#3a2a34"/>`;
    s += `<g transform="translate(1180,0)"><rect x="0" y="260" width="760" height="820" fill="#b8ab96" stroke="${C.ink}" stroke-width="8"/>`;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) s += `<rect x="${(r % 2) * 90 + c * 180}" y="${260 + r * 100}" width="180" height="100" fill="none" stroke="#8a7e68" stroke-width="6"/>`;
    for (let c = 0; c < 4; c++) s += `<rect x="${c * 200}" y="200" width="120" height="70" fill="#b8ab96" stroke="${C.ink}" stroke-width="8"/>`;
    s += `<text x="380" y="560" font-family="Luckiest" font-size="120" text-anchor="middle" fill="${C.red}" stroke="${C.ink}" stroke-width="8" paint-order="stroke">ROME</text></g>`;
    const bump = t > S(6) ? Math.abs(Math.sin((t - S(6)) * 5)) : 0;
    s += T.hannibal({ x: 640 + bump * 80, y: 460, s: 1.05, e: E(t > S(5) ? 'worried' : 'bored'), sweat: t > S(6) ? .8 : 0 });
    return K.cam(s, 1, 960, 540, K.shakeAt(t, [S(6) + .3], .2), t) + K.say('BUT ALSO…', 640, 140, 90, t, H(S(4)), { out: S(5) }) + K.say('EVEN GENIUS HAS LIMITS', 640, 140, 80, t, H(S(5)), { fill: C.gold });
  }],
  [S(7), (t, lt) => { // Rome was an idea
    let s = `<rect width="1920" height="1080" fill="#e8a65a"/><rect width="1920" height="380" fill="#d9874a"/>` + city(t, ease(lt / 2)) + `<rect y="760" width="1920" height="320" fill="#b8963f" stroke="${C.ink}" stroke-width="7"/>`;
    for (let i = 0; i < 5; i++) { const m = K.march(t, i, 5); s += T.legionary({ x: 200 + i * 380, y: 800 + m.bob, s: .45, e: E('determined'), arms: { r: { x: 70, y: 40 - Math.abs(Math.sin(t * 5 + i)) * 60, pose: 'fist' } }, seed: i + 30 }); }
    const ik = ease((t - S(8)) / .8);
    if (ik > 0) s += `<circle cx="960" cy="300" r="${f(220 * ik)}" fill="#fff6a8" opacity=".5"/>` + T.standard(960, 560, 1.1 * ik);
    return K.cam(s, 1, 960, 540, 0, t) + K.say('MORE THAN ONE CITY', 960, 140, 90, t, H(W('city')), { out: S(8) }) + K.stamp('AN IDEA', 960, 140, t, H(S(8) + .1), -4, { cross: false, size: 150, fill: C.gold })
      + K.say('IDEAS ARE HARDER TO KILL THAN MEN', 960, 1010, 64, t, H(S(9) + .3));
  }],
  [S(10), (t, lt) => { // next episode: Kadesh
    let s = K.burst(t, '#d9b45a', '#e3c26e');
    s += K.pharaoh({ x: 480, y: 470, s: .95, e: E('smug'), col: C.blue, seed: 3 }) + K.pharaoh({ x: 1440, y: 470, s: .95, e: E('angry'), col: C.red, seed: 7 }).replace('scale(0.95)', 'scale(-0.95,0.95)');
    const o = K.say('NEXT TIME: KADESH', 960, 150, 120, t, H(W('kadesh')), { fill: C.blue })
      + K.speech('I WON!', 640, 220, t, H(W('won')), { size: 60 }) + K.speech('NO, I WON!', 1280, 220, t, W('won') + .5, { size: 60, tail: 1 })
      + K.say('WHO WAS RIGHT?', 960, 1000, 90, t, H(W('right')), { fill: '#fff' });
    return K.cam(s, 1, 960, 540, 0, t) + o;
  }],
  [S(12), (t, lt) => { // subscribe
    let s = `<rect width="1920" height="1080" fill="#1d1411"/>`;
    s += T.text('SPEARS &amp; TEARS', 960, 330, 130, { fill: C.gold, stroke: C.ink });
    s += K.subscribe(960, 620, t, H(W('subscribe')));
    return s;
  }],
];
K.runScene(shots, { duration: dur, hits, fadeOut: 1.2 });
</script></body></html>
