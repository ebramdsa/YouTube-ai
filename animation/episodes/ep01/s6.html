<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../lib/toon.js"></script><script src="../../lib/kit.js"></script><script src="timing.js"></script><script src="battle.js"></script>
<script>
// Section 6 — The jaws close
const { C, ease, clamp, lerp, f } = T, E = T.expr;
const { S, W, dur } = K.timingFor(6);
const hits = [];
const H = t => (hits.push(t), t);
const kf = B.kf;
const state = t => ({
  rom: { cx: 960, cols: 24, op: 1,
    cy: kf(t, [[S(1), 300], [S(2), 400], [S(5) + 2, 470], [S(8), 480], [S(9) + 2, 600]]),
    gx: kf(t, [[S(8), 26], [S(9) + 2, 19], [S(19), 19], [S(19) + 3, 15]]),
    gy: kf(t, [[S(8), 24], [S(9) + 2, 30], [S(19), 30], [S(19) + 3, 21]]),
    fall: kf(t, [[S(19), 0], [S(22), .15], [S(23), .45]]) },
  jitter: kf(t, [[S(1), 1], [S(1) + .5, 2.5], [S(19), 2.5], [S(19) + 2, 4]]),
  gaul: { op: 1, cy: kf(t, [[S(2), 570], [S(5) + 2, 640], [S(19), 640], [S(19) + 3, 610]]), bulge: kf(t, [[S(2), 90], [S(4), 0], [S(5) + 1.5, -140], [S(19), -140], [S(19) + 3, -170]]),
    width: kf(t, [[S(5), 700], [S(11) + 2, 640], [S(19), 640], [S(19) + 3, 560]]) },
  afr: { op: 1, k: kf(t, [[S(11), 0], [S(11) + 3, 1]]) },
  rcav: { fleeL: kf(t, [[S(12) + 1, 0], [S(12) + 3.5, 1]]), fleeR: kf(t, [[S(16) + .5, 0], [S(16) + 3.5, 1]]) },
  ccav: { path: [[340, 600], [340, 330], [420, 140], [960, 90], [1450, 140], [960, 400]],
    u: kf(t, [[S(12), 0], [S(12) + 2.5, .2], [S(15), .2], [S(15) + 4, .8], [S(17), .8], [S(17) + 1.5, 1]]),
    rear: kf(t, [[S(17), 0], [S(17) + 1.5, 1]]),
    numX: kf(t, [[S(18), 1560], [S(18) + 1.5, 1300]]), numY: kf(t, [[S(16), 600], [S(16) + 2, 330], [S(18), 330], [S(18) + 1.5, 470]]),
    numA: kf(t, [[S(16), -90], [S(18), -90], [S(18) + .1, 180]]) },
});
const boardShot = (o = {}) => (t, lt) => {
  const s = B.board(t, state(t));
  const z = o.zoom ? o.zoom(t, lt) : 1, cy = o.cy ? o.cy(t) : 540;
  return K.cam(s, z, 960, cy, K.shakeAt(t, o.shake || [], .25) * .6, t) + (o.over ? o.over(t, lt) : '');
};

const shots = [
  [0, boardShot({ shake: [H(.2), H(.7), H(1.2)], over: t => K.stamp('BATTLE!', 960, 980, t, .2, -4, { cross: false, size: 150, fill: C.red }) + K.chapter(6, 'THE JAWS CLOSE', t, 0, 2.6) })],
  [S(1), boardShot({ shake: [H(S(2)), H(S(3)), H(S(3) + 1)], over: (t) =>
      K.say('PUSHED BACK', 960, 1000, 80, t, S(2), { out: S(4) }) + K.say('STEP BY STEP', 960, 1000, 80, t, S(3), { out: S(4) })
    + K.say('THE CRESCENT FLATTENS…', 960, 1000, 76, t, H(S(4)), { out: S(5) }) + K.say('…AND CAVES IN', 960, 1000, 86, t, H(S(5)), { fill: C.gold }) })],
  [S(6), (t, lt) => { // Romans think they're winning
    let s = K.burst(t, '#c4372c', '#d24a3c');
    for (let i = 0; i < 3; i++) s += T.legionary({ x: 360 + i * 600 + Math.sin(t * 6 + i) * 10, y: 420 + Math.abs(Math.sin(t * 6 + i)) * -10, s: .95, pose: 'bust', e: E(i === 1 ? 'proud' : 'smug'), seed: i + 2,
      arms: { r: { x: 160, y: 40, pose: 'fist' } } });
    return K.cam(s, 1, 960, 540, 0, t) + K.stamp('WINNING!', 960, 170, t, H(S(6) + .2), -4, { cross: false, size: 140, fill: C.gold });
  }],
  [S(8), boardShot({ zoom: (t, lt) => lerp(1, 1.2, ease(lt / 5)), cy: () => 600, over: t => K.say('DEEPER AND DEEPER', 960, 160, 90, t, H(W('deeper'))) + K.say('MORE MEN CROWD IN', 960, 1000, 76, t, H(S(9))) })],
  [S(10), (t, lt) => { // "Now."
    let s = K.burst(t, '#6d3f91', '#7b4ca0');
    const nw = W('now'), drop = ease((t - nw) / .18);
    s += T.hannibal({ x: 960, y: 420, s: 1.25, e: t > nw ? E('determined') : E('bored'), talk: t > nw && t < nw + .5 ? 1 : 0, t, arms: { r: { x: 170, y: lerp(-160, 80, drop), pose: t > nw ? 'point' : 'open' } } });
    return K.cam(s, 1 + lt * .03, 960, 480, K.shakeAt(t, [nw], .3), t) + K.stamp('NOW.', 1400, 220, t, H(nw), -6, { cross: false, size: 190, fill: C.red });
  }],
  [S(11), boardShot({ shake: [H(S(11) + 3), H(S(12) + 2.4)], over: (t) => K.say('THE AFRICANS STRIKE THE FLANKS', 960, 1000, 70, t, H(S(11) + .5), { out: S(12) })
    + K.say("ROMAN HORSEMEN: CRUSHED", 520, 160, 64, t, H(S(12) + 2.4), { fill: C.gold }) })],
  [S(13), (t, lt) => { // the cavalry don't stop
    let s = K.ground('#d8b468', 660, '#c9a457') + K.dust(t, 16, 1, '#f1dfae', 2);
    for (let i = 0; i < 3; i++) s += K.rider(-300 + ((lt * 520 + i * 640) % 2400), 920 - (i % 2) * 80, .75 - (i % 2) * .1, T.iberian({ pose: 'chibi', e: E('determined'), spear: [50, 150, 200, -120], seed: i + 5 }), { t: t + i, gallop: true, blanket: C.purple });
    return K.cam(s, 1, 960, 540, 0, t) + K.stamp('CELEBRATE', 620, 220, t, H(S(13) + .5), -5, { size: 100 }) + K.stamp('CHASE', 1320, 220, t, H(S(14) + .5), 4, { size: 110 });
  }],
  [S(15), boardShot({ shake: [H(S(17) + 1.5)], zoom: (t, lt) => t > S(18) ? lerp(1, 1.18, ease((t - S(18)) / 1.2)) : 1, cy: t => t > S(18) ? lerp(540, 600, ease((t - S(18)) / 1.2)) : 540, over: t =>
      K.say('ALL THE WAY AROUND', 960, 1000, 76, t, H(S(15) + .4), { out: S(16) }) + K.say('NUMIDIANS DRIVE OFF THE LAST ROMAN HORSE', 960, 1000, 56, t, H(S(16) + .3), { out: S(17) })
    + K.stamp('INTO THE REAR', 960, 1000, t, H(S(17) + 1.5), -3, { cross: false, size: 80, fill: C.purple })
    + K.stamp('SURROUNDED', 960, 170, t, H(S(18) + .2), -4, { cross: false, size: 150, fill: C.red }) })],
  [S(19), (t, lt) => { // crushed together
    let s = K.burst(t, '#8a3a32', '#9a4a3c');
    const sq = ease(lt / 3), n = 7;
    for (let i = 0; i < n; i++) { const x = lerp(160 + i * 270, 560 + i * 130, sq), y = 470 + Math.sin(t * 7 + i) * 8;
      s += T.legionary({ x, y, s: .78, pose: 'bust', e: E(t > S(21) ? 'scared' : t > S(20) ? 'worried' : 'shocked', { look: [i % 2 ? .4 : -.4, 0] }), sweat: 1, seed: i + 1, flip: i % 2 === 1 }); }
    const o = K.say('NO ROOM TO SWING A SWORD', 960, 140, 80, t, H(S(19) + .2), { out: S(20) }) + K.say('THE FRONT: CONFUSED', 960, 140, 90, t, H(S(20)), { out: S(21) }) + K.say('THE BACK: TRAPPED', 960, 140, 90, t, H(S(21)));
    if (t > S(22)) { let heads = '<clipPath id="can"><rect x="-480" y="-165" width="960" height="330" rx="100"/></clipPath><g clip-path="url(#can)">'; for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) heads += `<g transform="translate(${-420 + i * 120 + r * 60},${-80 + r * 120 + Math.sin(t * 5 + i + r) * 4}) scale(.42)">${T.legionary({ pose: 'bust', e: E(r ? 'scared' : 'shocked', { look: [i % 2 ? .4 : -.4, 0] }), seed: i + r * 8, sweat: 1 })}</g>`; heads += '</g>';
      return K.cam(K.burst(t, '#3c6fb0', '#4a7cbc') + K.sardineCan(900, 560, 1.1 * T.back((t - S(22)) / .4), heads), 1, 960, 540, 0, t) + K.say('LIKE SARDINES IN A CAN', 960, 140, 92, t, H(S(22) + .3), { fill: C.gold }); }
    return K.cam(s, 1, 960, 540, K.shakeAt(t, [S(19) + .2], .2) * .5, t) + o;
  }],
  [S(23), (t, lt) => { // sunset
    let s = K.sunset(lt);
    s += K.rider(lerp(200, 900, lt / 3.2), 900, .8, T.hannibal({ pose: 'chibi', e: E('bored') }), { t, blanket: C.purple });
    s += `<rect width="1920" height="1080" fill="#2a1d17" opacity=".25"/>`;
    return K.cam(s, 1, 960, 540, 0, t) + K.say('BY SUNSET, IT WAS OVER', 960, 170, 96, t, S(23) + .3);
  }],
  [S(24), (t, lt) => { // casualty figures
    let s = `<rect width="1920" height="1080" fill="#2a1d17"/>`;
    s += K.say('POLYBIUS:', 960, 240, 64, t, S(24), { fill: C.gold }) + K.say('~70,000 ROMANS DEAD', 960, 380, 110, t, H(W('seventy')), { fill: C.red });
    s += K.say('OTHER HISTORIANS:', 960, 560, 56, t, S(25), { fill: '#cfd4dc' }) + K.say('~48,000', 960, 680, 110, t, H(W('forty')), { fill: C.red });
    s += K.say('ONE OF THE BLOODIEST DAYS IN HISTORY', 960, 900, 70, t, H(S(26) + .3), { fill: '#fff' });
    return s;
  }],
  [S(27), (t, lt) => { // Paullus dies
    let s = `<rect width="1920" height="1080" fill="#3a2a24"/>`;
    s += `<g opacity="${f(1 - ease((lt - 1.4) / .8) * .6)}">${T.paullus({ x: 960, y: 420, s: 1.15, e: E('worried', { lid: .5 }), sweat: .6 })}</g>`;
    return K.cam(s, 1, 960, 540, 0, t) + K.lowerThird('PAULLUS', 'Died on the field', t, H(W('paullus')));
  }],
  [S(28), (t, lt) => { // Varro runs
    let s = K.ground('#d8b468', 640, '#c9a457') + K.dust(t, 14, 1, '#f1dfae', 5);
    s += K.rider(lerp(1500, -400, lt / 6.5), 940, 1, T.varro({ pose: 'chibi', e: E('scared'), sweat: 1 }), { t, gallop: true, flip: true, blanket: C.red });
    return K.cam(s, 1, 960, 540, 0, t) + K.stamp('VARRO ESCAPED', 1200, 220, t, H(W('escaped')), -5, { cross: false, size: 110, fill: C.gold });
  }],
  [S(29), (t, lt) => { // Hannibal's losses
    let s = K.sunset(lt + 4) + `<rect width="1920" height="1080" fill="#2a1d17" opacity=".2"/>`;
    s += T.hannibal({ x: 960, y: 440, s: 1.1, e: E('bored', { lid: .6 }) });
    return K.cam(s, 1, 960, 540, 0, t) + K.say('HANNIBAL LOST 6,000–8,000', 960, 170, 90, t, H(S(29) + .4));
  }],
];
K.runScene(shots, { duration: dur, hits });
</script></body></html>
